<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestro cielo</title>
<meta name="description" content="Para mi principessina ✦">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04050d">
<meta property="og:title" content="Nuestro cielo">
<meta property="og:description" content="Para mi principessina ✦">
<meta property="og:image" content="https://matteotirocchi9.github.io/nuestro-cielo/og.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#04050d; --gold:#f3d9a4; --gold-soft:rgba(243,217,164,.7); --paper:#f5eee2; --paper-2:#ebe1d0;
  --ink:#3b2a22; --seal:#8e1b22; --rose:#ffb8cb; --glass:rgba(12,14,30,.55); --line:rgba(243,217,164,.22);
  --serif:"Cormorant Garamond",Georgia,serif; --hand:"Caveat","Bradley Hand",cursive;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--gold);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--serif);font-variant-numeric:lining-nums;position:fixed;inset:0;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#sky{position:fixed;inset:0;touch-action:none;display:block}
.hidden{display:none!important}

/* ---------- Sobre ---------- */
#env-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px 16px;transition:opacity 1.2s ease}
#env-screen.gone{opacity:0;pointer-events:none}
.env-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.env{position:relative;width:min(84vw,360px);aspect-ratio:1.45;animation:float 6s ease-in-out infinite;perspective:900px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
.env-back,.env-front,.env-flap{position:absolute;inset:0;border-radius:6px}
.env-back{background:linear-gradient(160deg,var(--paper-2),#d9ccb6);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(243,217,164,.08)}
.env-front{background:linear-gradient(170deg,var(--paper),var(--paper-2));clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5%}
.env-front::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,rgba(0,0,0,.06) 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,rgba(0,0,0,.06) 50%,transparent 50.4%);pointer-events:none}
.env-to{font-family:var(--hand);font-size:clamp(22px,6.4vw,29px);white-space:nowrap;color:var(--ink);opacity:.85;transform:rotate(-3deg)}
.env-flap{background:linear-gradient(180deg,#efe6d6,#e2d5c0);clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top center;z-index:4;transition:transform 1s cubic-bezier(.6,.05,.3,1),z-index 0s .5s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.letter{position:absolute;left:7%;right:7%;top:6%;bottom:6%;background:#fbf7ef;border-radius:3px;z-index:2;transition:transform 1.3s cubic-bezier(.3,.7,.2,1) .7s;box-shadow:0 2px 10px rgba(0,0,0,.15);
  background-image:repeating-linear-gradient(transparent 0 22px,rgba(120,100,80,.08) 22px 23px)}
.env.open .letter{transform:translateY(-58%)}
.seal{position:absolute;left:50%;top:56%;width:68px;height:68px;margin:-34px 0 0 -34px;z-index:5;border-radius:48% 52% 50% 50%/50% 46% 54% 50%;
  background:radial-gradient(circle at 34% 30%,#d4454c 0,#a3222a 30%,#7a1219 62%,#560b10 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 0 0 5px rgba(90,10,16,.35),inset 0 0 0 7px rgba(255,160,150,.12),inset -4px -6px 10px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;transition:transform .6s cubic-bezier(.5,-0.4,.5,1.4),opacity .6s}
.seal span{font-family:var(--serif);font-style:italic;font-size:34px;color:#5c0d13;text-shadow:1px 1px 0 rgba(255,150,140,.35),-1px -1px 0 rgba(0,0,0,.35);margin-top:-2px}
.seal::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 0 rgba(243,217,164,.5);animation:ping 2.6s ease-out infinite}
.seal.quiet::after{animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(243,217,164,.45)}80%,100%{box-shadow:0 0 0 18px rgba(243,217,164,0)}}
.seal.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-6deg)}40%,80%{transform:translateX(7px) rotate(6deg)}}
.seal.checking{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.35) drop-shadow(0 0 12px rgba(255,200,150,.6))}}
.seal.broken{transform:translateY(40px) rotate(35deg) scale(.7);opacity:0;pointer-events:none}
.env-hint{font-style:italic;font-size:18px;color:var(--gold-soft);letter-spacing:.04em;margin:0;transition:opacity .5s}
.unlock{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(84vw,340px);opacity:0;transform:translateY(10px);transition:all .6s ease;pointer-events:none}
.unlock.show{opacity:1;transform:none;pointer-events:auto}
.unlock label{font-style:italic;font-size:19px;text-align:center;color:var(--gold)}
.unlock-row{display:flex;gap:10px;width:100%}
.unlock input{flex:1;min-width:0;font-family:var(--serif);font-size:22px;letter-spacing:.12em;text-align:center;color:var(--gold);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 10px;outline:none;user-select:text;-webkit-user-select:text}
.unlock input:focus{border-color:rgba(243,217,164,.55);background:rgba(255,255,255,.07)}
.unlock input::placeholder{color:rgba(243,217,164,.3);letter-spacing:.06em}
.btn-gold{background:linear-gradient(180deg,#f6e2b6,#dcb877);color:#2a1d10;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:500;box-shadow:0 6px 20px rgba(220,184,119,.25)}
.btn-gold:active{transform:scale(.97)}
.unlock-msg{min-height:22px;margin:0;font-style:italic;font-size:17px;color:var(--rose);text-align:center}

/* ---------- Carta de bienvenida ---------- */
#intro-card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px 16px;z-index:20;opacity:0;pointer-events:none;transition:opacity 1s ease}
#intro-card.show{opacity:1;pointer-events:auto}
.paper{background:#fbf7ef;color:var(--ink);border-radius:4px;width:min(92vw,400px);max-height:84vh;overflow:auto;padding:30px 26px 24px;box-shadow:0 30px 90px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(120,100,80,.09) 33px 34px);transform:translateY(20px) rotate(-1deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.show .paper{transform:none}
.paper p{font-family:var(--hand);font-size:25px;line-height:34px;margin:0;white-space:pre-line}
.paper .firma{text-align:right;margin-top:14px}
.paper .btn-gold{display:block;margin:22px auto 0;font-family:var(--serif)}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:10;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
body.in-sky .hud{opacity:1}
body.in-sky .hud>*{pointer-events:auto}
body.finale .hud{opacity:0!important}
body.finale .hud>*{pointer-events:none!important}
#hud-top{top:calc(var(--sat) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
#hud-bottom{bottom:calc(var(--sab) + 16px);left:16px;right:16px;display:flex;justify-content:center;align-items:center;gap:10px}
.moon-btn{display:flex;flex-direction:column;align-items:center;gap:4px}
.moon-btn svg{filter:drop-shadow(0 0 14px rgba(255,240,210,.35))}
.moon-cap{font-size:14px;font-style:italic;color:var(--gold-soft);letter-spacing:.03em}
.music-btn{width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.music-btn svg{transition:transform .3s}
.music-btn.playing svg{animation:spin 6s linear infinite}
.music-btn.invite{animation:invite 2s ease-in-out infinite}
@keyframes invite{50%{box-shadow:0 0 0 7px rgba(243,217,164,.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
.counter{font-size:15px;font-style:italic;color:var(--gold-soft);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.scroll-hint{position:fixed;left:50%;bottom:calc(var(--sab) + 72px);transform:translateX(-50%);font-style:italic;font-size:15px;color:var(--gold-soft);z-index:9;pointer-events:none;opacity:0;transition:opacity 1s}
.scroll-hint.show{opacity:1;animation:bob 2.4s ease-in-out infinite}
body.finale .scroll-hint{opacity:0!important}
@keyframes bob{50%{transform:translate(-50%,6px)}}

/* ---------- Polaroid ---------- */
.modal{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 56px) 16px calc(var(--sab) + 24px);background:rgba(3,4,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s ease}
.modal.open{opacity:1;pointer-events:auto}
.pol-etapa{font-style:italic;font-size:17px;color:var(--gold-soft);margin:0 0 14px;letter-spacing:.04em}
.pol{background:#fdfbf6;padding:12px 12px 0;width:min(88vw,380px);box-shadow:0 30px 70px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.4) inset;transform:scale(.9) rotate(var(--rot,0deg));transition:transform .6s cubic-bezier(.2,.9,.25,1.2);touch-action:pan-y}
.modal.open .pol{transform:scale(1) rotate(var(--rot,0deg))}
.pol-photo{background:#1a1612;position:relative;min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pol-photo img{display:block;width:100%;height:auto;max-height:52vh;object-fit:cover;opacity:0}
.pol-photo img.dev{opacity:1;animation:develop 3.2s cubic-bezier(.25,.6,.3,1) both}
@keyframes develop{0%{filter:sepia(1) brightness(2.4) contrast(.35) blur(10px) saturate(.2)}35%{filter:sepia(.7) brightness(1.5) contrast(.6) blur(4px) saturate(.5)}100%{filter:none}}
.pol-spin{position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid rgba(243,217,164,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
.pol-cap{padding:14px 6px 16px;min-height:96px;text-align:center}
.pol-frase{font-family:var(--hand);font-size:25px;line-height:1.15;color:var(--ink);margin:0;opacity:0;transition:opacity 1.2s ease .9s}
.pol-meta{font-family:var(--serif);font-style:italic;font-size:15px;color:#8a7a6c;margin:8px 0 0;opacity:0;transition:opacity 1.2s ease 1.3s}
.pol.ready .pol-frase,.pol.ready .pol-meta{opacity:1}
.pol-nav{display:flex;align-items:center;gap:18px;margin-top:18px}
.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:26px;line-height:1;color:var(--gold);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03)}
.nav-btn:disabled{opacity:.2}
.dots{display:flex;gap:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(243,217,164,.25)}
.dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.close-btn{position:absolute;top:calc(var(--sat) + 12px);right:14px;width:44px;height:44px;font-size:30px;line-height:1;color:var(--gold-soft)}

/* ---------- Tarjetas y hoja ---------- */
#card{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translate(-50%,20px);width:min(92vw,380px);z-index:25;background:rgba(14,16,34,.86);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.2,.8,.2,1);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card h3{font-weight:500;font-style:italic;font-size:21px;margin:0;color:var(--gold)}
#card p{margin:6px 0 0;font-size:17px;color:rgba(243,217,164,.8);white-space:pre-line}
#card p.hand{font-family:var(--hand);font-size:24px;color:var(--rose);line-height:1.15}
#card .actions{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#card .actions a,#card .actions button{font-size:16px;text-decoration:none;border-radius:12px;padding:9px 14px}
.act-main{background:linear-gradient(180deg,#f6e2b6,#dcb877);color:#2a1d10}
.act-soft{border:1px solid var(--line);color:var(--gold-soft)}
#yt{position:fixed;left:50%;top:calc(var(--sat) + 76px);transform:translateX(-50%);width:min(92vw,380px);z-index:26;background:rgba(14,16,34,.9);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
#yt.mini{transform:translate(-160vw,0);opacity:0;pointer-events:none}
#yt .yt-t{margin:0 0 10px;text-align:center;font-style:italic;font-size:18px;color:var(--gold)}
#yt .yt-t small{display:block;font-size:14px;color:var(--gold-soft)}
#yt .yt-f{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
#yt iframe{width:100%;height:100%;border:0;display:block}
#yt .yt-close{display:block;margin:10px auto 0;font-style:italic;font-size:16px;color:var(--gold-soft);padding:6px 12px}


/* ---------- Final ---------- */
#final{position:fixed;inset:0;z-index:22;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 38vh) 16px calc(var(--sab) + 30px);pointer-events:none;opacity:0;transition:opacity 1s ease;background:linear-gradient(to bottom,transparent 30vh,rgba(3,4,12,.55) 45vh)}
#final.show{opacity:1;pointer-events:auto}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:0 auto}
.postit{min-height:clamp(150px,42vw,200px);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 12px;
  background:linear-gradient(170deg,#fff6b8 0%,#fbeb93 70%,#f3df7c 100%);color:#3a3322;font-family:var(--hand);font-size:clamp(18px,5vw,22px);line-height:1.15;white-space:pre-line;
  box-shadow:0 12px 24px rgba(0,0,0,.45),inset 0 -10px 18px rgba(180,150,40,.12);border-radius:2px;opacity:0;transform:translateY(-30px) scale(1.12) rotate(var(--r));}
.postit.on{animation:stick .7s cubic-bezier(.2,.9,.3,1.25) forwards}
@keyframes stick{to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}}
.final-end{text-align:center;margin-top:26px;opacity:0;transition:opacity 1.2s ease}
.final-end.on{opacity:1}
.final-firma{font-family:var(--hand);font-size:30px;color:var(--rose);margin:0 0 14px}
.overlay{position:fixed;inset:0;z-index:32;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:rgba(3,4,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .5s ease}
.overlay.open{opacity:1;pointer-events:auto}
.overlay .paper{transform:translateY(30px) rotate(-1deg)}
.overlay.open .paper{transform:none}
.c-kicker{font-family:var(--serif)!important;font-style:italic;font-size:17px!important;line-height:1.2!important;color:#8a7a6c;margin:0!important}
.c-title{font-family:var(--hand);font-weight:600;font-size:31px;line-height:1.1;color:var(--ink);margin:2px 0 16px}
.voice-btn{display:flex;align-items:center;gap:10px;margin:18px auto 0;background:linear-gradient(180deg,#ffd6e2,#f5a3bb);color:#3a0f1d;border-radius:999px;padding:11px 20px;font-family:var(--serif);font-size:18px;box-shadow:0 8px 20px rgba(245,155,180,.35)}
.voice-btn .bars{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.voice-btn .bars i{width:3px;height:5px;background:#3a0f1d;border-radius:2px}
.voice-btn.playing .bars i{animation:bar .9s ease-in-out infinite}
.voice-btn.playing .bars i:nth-child(2){animation-delay:.2s}.voice-btn.playing .bars i:nth-child(3){animation-delay:.4s}.voice-btn.playing .bars i:nth-child(4){animation-delay:.1s}
@keyframes bar{50%{height:16px}}
.sky-panel{width:min(92vw,400px);max-height:86vh;overflow:auto;background:rgba(14,16,36,.94);border:1px solid var(--line);border-radius:22px;padding:22px 20px 18px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(24px);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.overlay.open .sky-panel{transform:none}
.sp-date{margin:0;text-align:center;font-style:italic;font-size:16px;color:var(--gold-soft)}
.sp-title{margin:2px 0 14px;text-align:center;font-weight:500;font-style:italic;font-size:27px;color:var(--gold)}
.sp-moon{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.sp-moon svg{flex:none;filter:drop-shadow(0 0 14px rgba(255,240,210,.3))}
.sp-moon b{display:block;font-weight:500;font-size:19px;color:var(--gold)}
.sp-moon span{font-style:italic;font-size:15px;color:var(--gold-soft)}
.sp-block{border-top:1px solid var(--line);padding:12px 0 2px;margin-top:10px}
.sp-block h4{margin:0 0 4px;font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,217,164,.55)}
.sp-block p{margin:0;font-size:18px;line-height:1.35;color:rgba(243,217,164,.9);white-space:pre-line}
.sp-event{background:linear-gradient(180deg,rgba(255,184,203,.14),rgba(255,184,203,.06));border:1px solid rgba(255,184,203,.3);border-radius:14px;padding:12px 14px;margin:6px 0 4px}
.sp-event p{color:var(--rose)!important;font-family:var(--hand);font-size:23px!important;line-height:1.15!important}
.sp-foot{text-align:center;margin:16px 0 0;font-style:italic;font-size:16px;color:var(--gold-soft)}
.sp-close{display:block;margin:14px auto 0;font-style:italic;font-size:17px;color:var(--gold-soft);padding:6px 14px}
.moon-btn.invite svg{animation:mglow 2.2s ease-in-out infinite}
@keyframes mglow{50%{filter:drop-shadow(0 0 22px rgba(255,200,215,.9))}}
@media (prefers-reduced-motion:reduce){.env{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="env-screen">
<script>try{if(localStorage.getItem('nc.k'))document.getElementById('env-screen').style.opacity=0}catch(e){}</script>
  <div class="env-wrap">
    <p class="env-hint" id="env-hint">Tocá el sello</p>
    <div class="env" id="env">
      <div class="env-back"></div>
      <div class="letter"></div>
      <div class="env-front"><span class="env-to">Para mi principessina</span></div>
      <div class="env-flap"></div>
      <button class="seal" id="seal" aria-label="Abrir el sobre"><span>M</span></button>
    </div>
    <form class="unlock" id="unlock" autocomplete="off">
      <label for="pass">Para abrirlo, escribí nuestra fecha</label>
      <div class="unlock-row">
        <input id="pass" inputmode="numeric" maxlength="16" placeholder="DD / MM / AAAA" aria-label="Nuestra fecha">
        <button class="btn-gold" type="submit">Abrir</button>
      </div>
      <p class="unlock-msg" id="unlock-msg"></p>
    </form>
  </div>
</div>

<div id="intro-card"><div class="paper"><p id="intro-text"></p><p class="firma" id="intro-firma"></p><button class="btn-gold" id="btn-enter">Ver nuestro cielo</button></div></div>

<div class="hud" id="hud-top">
  <button class="music-btn hidden" id="btn-music" aria-label="Nuestra canción">
    <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#15131c" stroke="#f3d9a4" stroke-opacity=".5"/><circle cx="12" cy="12" r="7" fill="none" stroke="#f3d9a4" stroke-opacity=".15"/><circle cx="12" cy="12" r="4.4" fill="none" stroke="#f3d9a4" stroke-opacity=".15"/><circle cx="12" cy="12" r="2.4" fill="#c9303a"/><circle cx="12" cy="12" r=".7" fill="#15131c"/></svg>
  </button>

<script>
(() => {
'use strict';
const P = window.PAYLOAD;
const $ = (s) => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('nc.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nc.' + k, JSON.stringify(v)); } catch (e) {} },
};
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeBack = (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const now = () => performance.now() / 1000;

/* ================= Cifrado ================= */
let KEY = null, M = null;
async function deriveKey(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(P.salt), iterations: P.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function dec(key, bytes) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12)));
}
async function tryUnlock(pass) {
  try {
    const k = await deriveKey(pass);
    M = JSON.parse(new TextDecoder().decode(await dec(k, b64d(P.meta))));
    KEY = k;
    return true;
  } catch (e) { return false; }
}
function normPass(s) {
  const parts = s.split(/\D+/).filter(Boolean);
  let d, m, y;
  if (parts.length >= 3) [d, m, y] = parts;
  else {
    const t = s.replace(/\D/g, '');

      + `<button class="yt-close" type="button">Seguir mirando el cielo ✦</button>`;

  }
  yt.classList.remove('hidden', 'mini');
  $('#btn-music').classList.remove('invite');
}

/* ================= El cielo de hoy ================= */
const FASES = ['Luna nueva', 'Luna creciente', 'Cuarto creciente', 'Gibosa creciente', 'Luna llena', 'Gibosa menguante', 'Cuarto menguante', 'Luna menguante'];
const SIGNOS_N = ['Aries', 'Tauro', 'Géminis', 'Cáncer', 'Leo', 'Virgo', 'Libra', 'Escorpio', 'Sagitario', 'Capricornio', 'Acuario', 'Piscis'];
const cieloHoy = () => (M.cielo || []).find((x) => x.d === todayAR());
function realMoonSVG(ang) {
  // ang: 0 nueva, 180 llena; hemisferio sur, como la ve ella desde Argentina
  const R = 26, c = 30, k = (1 - Math.cos(ang * Math.PI / 180)) / 2, waxing = ang < 180;
  const rx = R * Math.abs(1 - 2 * k);
  let lit;
  if (k > .985) lit = `<circle cx="${c}" cy="${c}" r="${R}" fill="url(#mg2)"/>`;
  else if (k < .015) lit = '';
  else {
    const right = !waxing; // en el sur, la creciente se ilumina por la izquierda
    const s1 = right ? 1 : 0, s2 = (k < .5) === right ? 0 : 1;
    lit = `<path fill="url(#mg2)" d="M${c},${c - R} A${R},${R} 0 0 ${s1} ${c},${c + R} A${rx},${R} 0 0 ${s2} ${c},${c - R} Z"/>`;
  }
  return `<svg width="60" height="60" viewBox="0 0 60 60"><defs><radialGradient id="mg2" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#f1e6cf"/><stop offset="1" stop-color="#d8c9a8"/></radialGradient></defs><circle cx="${c}" cy="${c}" r="${R}" fill="#1b2036" stroke="#f3d9a4" stroke-opacity=".2"/>${lit}</svg>`;
}
function openCielo() {
  hideCard();
  const hoy = cieloHoy(), T = M.cieloTextos || {}, m = moonState();
  const esc = (x) => String(x).replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  let html = `<p class="sp-date">${esc(fmtFecha(todayAR()))}</p><h3 class="sp-title">El cielo de hoy</h3>`;
  if (hoy) {
    const ev = T.eventos && T.eventos[hoy.d];
    html += `<div class="sp-moon">${realMoonSVG(hoy.ang)}<div><b>${FASES[hoy.fase]}</b><span>${hoy.ilum}% iluminada · en ${SIGNOS_N[hoy.signo]}</span></div></div>`;
    if (ev) html += `<div class="sp-event"><p>${esc(ev)}</p></div>`;
    html += `<div class="sp-block"><h4>La Luna</h4><p>${esc((T.fases || [])[hoy.fase] || '')}\n\n${esc((T.signos || [])[hoy.signo] || '')}</p></div>`;
    const venusTxt = hoy.venus ? T.venusRx : (hoy.d < '2026-10-03' ? T.venusAntes : T.venusDirecta);
    if (venusTxt) html += `<div class="sp-block"><h4>♀\uFE0E Venus, tu planeta</h4><p>${esc(venusTxt)}</p></div>`;
    if (hoy.mercurio && T.mercurioRx) html += `<div class="sp-block"><h4>☿\uFE0E Mercurio</h4><p>${esc(T.mercurioRx)}</p></div>`;
    if (T.misma) html += `<p class="sp-foot">${esc(T.misma)}</p>`;
  }
  html += `<p class="sp-foot">${esc(m.title)} ✦</p><button class="sp-close" type="button" id="sp-close">Volver al cielo</button>`;
  $('#sky-panel').innerHTML = html;
  $('#sp-close').onclick = () => $('#cielo').classList.remove('open');
  $('#cielo').classList.add('open');
  $('#sky-panel').scrollTop = 0;
  $('#btn-moon').classList.remove('invite');
  LS.set('cieloVisto', todayAR());
}
$('#cielo').addEventListener('click', (e) => { if (e.target.id === 'cielo') $('#cielo').classList.remove('open'); });

/* ================= Final ================= */
async function runFinal() {
  if (mode === 'final') return;
  hideCard(); $('#cielo').classList.remove('open'); closeCarta();
  try { await document.fonts.load('italic 500 120px "Cormorant Garamond"'); } catch (e) {}
  mode = 'final'; finalT0 = now(); finalOut = 0;
  document.body.classList.add('finale');
  camTarget = null; camV = 0;
  buildParticles();
  const notes = $('#notes'), fin = $('#final');
  const list = M.postits && M.postits.length ? M.postits : [M.mensajeFinal || ''];
  notes.innerHTML = '';
  list.forEach((txt, i) => { const n = document.createElement('div'); n.className = 'postit'; n.textContent = txt; n.style.setProperty('--r', (((i * 37) % 7) - 3) + 'deg'); notes.appendChild(n); });
  $('#final-end').classList.remove('on');
  $('#final-firma').textContent = M.firma ? `Tu ${M.firma} ♡` : '';
  fin.scrollTop = 0;
  setTimeout(() => {
    if (mode !== 'final') return;
    fin.classList.add('show');
    [...notes.children].forEach((n, i) => setTimeout(() => {
      if (mode !== 'final') return;
      n.classList.add('on');
      const r = n.getBoundingClientRect();
      if (r.bottom > innerHeight - 20) fin.scrollBy({ top: r.bottom - innerHeight + 40, behavior: 'smooth' });
    }, 400 + i * 1300));
    setTimeout(() => { if (mode === 'final') { $('#final-end').classList.add('on'); const e = $('#final-end').getBoundingClientRect(); if (e.bottom > innerHeight) fin.scrollBy({ top: e.bottom - innerHeight + 30, behavior: 'smooth' }); } }, 400 + list.length * 1300 + 600);
  }, 5000);
}
function buildParticles() {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d');
  const lines = (M.textoFinal || 'Te amo').split('\n');
  let fs = Math.min(W * .3, 170);
  const setF = (k) => { o.font = `italic 500 ${fs * k}px "Cormorant Garamond", Georgia, serif`; };
  const widest = () => Math.max(...lines.map((l, i) => { setF(i ? .6 : 1); return o.measureText(l).width; }));
  while (widest() > W * .84 && fs > 30) fs -= 4;
  o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
  const ty = H * (lines.length > 1 ? .2 : H > 700 ? .27 : .24);
  lines.forEach((l, i) => { setF(i ? .6 : 1); o.fillText(l, W / 2, ty + (i ? fs * .7 + (i - 1) * fs * .62 : 0)); });
  const data = o.getImageData(0, 0, W, H).data;
  const gap = Math.max(2, Math.round(fs * (lines.length > 1 ? .6 : 1) / 26));
  let targets = [];
  for (let y = 0; y < H; y += gap) for (let x = 0; x < W; x += gap) if (data[(y * W + x) * 4 + 3] > 140) targets.push([x, y]);
  for (let i = targets.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [targets[i], targets[j]] = [targets[j], targets[i]]; }
  targets = targets.slice(0, 2400);
  const starts = mem.map((s) => toScreen(s.x, s.y, 1));
  particles = targets.map((p, i) => {
    let sx, sy;
    if (i < starts.length) [sx, sy] = starts[i];
    else { const b = bg[(Math.random() * bg.length) | 0]; [sx, sy] = toScreen(b.x, b.y, b.depth); if (sy < -20 || sy > H + 20) { sx = Math.random() * W; sy = Math.random() * H; } }
    return { sx, sy, tx: p[0] + (Math.random() - .5) * gap * .6, ty: p[1] + (Math.random() - .5) * gap * .6, d: Math.random() * 1.2, ph: Math.random() * 6.28, big: i < starts.length };
  });
}
function drawParticles(t) {
  const out = finalOut ? clamp(1 - (t - finalOut) / 1.2, 0, 1) : 1;
  if (finalOut && out <= 0) { particles = []; finalOut = 0; return; }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const u = clamp((t - finalT0 - .6 - p.d) / 3, 0, 1), e = ease(u);
    const x = p.sx + (p.tx - p.sx) * e + Math.sin(u * Math.PI) * 30 * Math.sin(p.ph);
    const y = p.sy + (p.ty - p.sy) * e + Math.sin(u * Math.PI) * 30 * Math.cos(p.ph);
    const tw = .6 + .4 * Math.sin(t * 3 + p.ph);
    const a = (u > 0 ? .9 : .5) * tw * out;
    if (p.big) drawGlowStar(x, y, 1.8, '255,215,160', a, 3);
    else { ctx.fillStyle = `rgba(255,236,205,${a})`; ctx.beginPath(); ctx.arc(x, y, 1.1, 0, 6.2832); ctx.fill(); }
  }
  ctx.globalCompositeOperation = 'source-over';
}
$('#btn-final-back').onclick = () => {
  $('#final').classList.remove('show');
  mode = 'sky'; finalOut = now();
  document.body.classList.remove('finale');
};

/* ================= Entrada ================= */
function maskDate(v) {
  const d = v.replace(/\D/g, '').slice(0, 8);
  return [d.slice(0, 2), d.slice(2, 4), d.slice(4)].filter(Boolean).join(' / ');
}
const passEl = $('#pass');
passEl.addEventListener('input', () => { passEl.value = maskDate(passEl.value); $('#unlock-msg').textContent = ''; });
$('#seal').onclick = () => {
  askGyro();
  $('#seal').classList.add('quiet');
  $('#env-hint').style.opacity = 0;
  $('#unlock').classList.add('show');
  setTimeout(() => passEl.focus(), 250);
};
let fails = 0;
$('#unlock').addEventListener('submit', async (e) => {
  e.preventDefault();
  primeAudio();
  const seal = $('#seal');
  seal.classList.add('checking');
  const pass = normPass(passEl.value);
  const ok = await tryUnlock(pass);
  seal.classList.remove('checking');
  if (!ok) {
    fails++;
    seal.classList.remove('shake'); void seal.offsetWidth; seal.classList.add('shake');
    $('#unlock-msg').textContent = fails >= 2 ? 'Pista: el día que nos casamos 💍' : 'Esa no es… pensá en el día más lindo';
    return;
  }
  LS.set('k', pass);
  passEl.blur();
  $('#unlock').classList.remove('show');
  seal.classList.add('broken');
  setTimeout(() => $('#env').classList.add('open'), 450);
  loadMusic(true);
  initSky();
  $('#intro-text').textContent = M.intro || '';
  $('#intro-firma').textContent = M.firma || '';
  setTimeout(() => { $('#env-screen').classList.add('gone'); $('#intro-card').classList.add('show'); }, 2500);
});
$('#btn-enter').onclick = () => { $('#intro-card').classList.remove('show'); enterSky(true); };

function enterSky(first) {
  mode = 'sky';
  $('#env-screen').classList.add('gone');
  document.body.classList.add('in-sky');
  const t = now();
  zod.born = t + (first ? .3 : .1);
  mem.forEach((s, i) => { s.born = t + (first ? 1.2 + i * .07 : .3 + i * .02); });
  ets.forEach((e) => { if (e.done) e.doneAt = -99; });
  drawMoon(); updateCounter();
  if (M.cielo && LS.get('cieloVisto', '') !== todayAR()) $('#btn-moon').classList.add('invite');
  const delay = first ? 1500 + mem.length * 70 : 700;
  setTimeout(() => {
    if (first && M.cancion && M.cancion.youtube && !M.cancion.src) openYT();
    else if (first) showCard({ title: 'Cada estrella dorada es un recuerdo', body: 'Tocalas para abrirlas', auto: 6000 });
    else if (M.cieloTextos && M.cieloTextos.eventos && M.cieloTextos.eventos[todayAR()]) showCard({ title: 'Mirá el cielo de hoy ✦', body: 'Tocá la luna: hoy pasa algo especial allá arriba.', auto: 7000 });
    else if (M.saludoNoche && hourAR() < 6) showCard({ title: M.saludoNoche, body: M.saludoNocheTexto || '', auto: 8000 });
    else { const m = moonState(); showCard({ title: M.saludo || 'Hola de nuevo', body: m.title, auto: 5000 }); }
    if (worldH > H + 40) setTimeout(() => $('#scroll-hint').classList.add('show'), first ? 3500 : 1500);
  }, delay);
  setTimeout(async () => { for (const s of mem) { try { await fileURL(s.src, 'image/jpeg'); } catch (e) {} } }, 1500);
}

try { document.fonts.load('21px Caveat'); document.fonts.load('italic 20px "Cormorant Garamond"'); } catch (e) {}
if (location.hostname === 'localhost') {
  window.__nc = { runFinal, openMem: (i) => openMem(mem[i]) };
  // solo para probar en el Mac: ?k=fecha&final muestra el final directo
  const q = new URLSearchParams(location.search);
  if (q.has('final') && q.get('k')) tryUnlock(q.get('k')).then((ok) => { if (!ok) return; initSky(); enterSky(false); hideCard(); setTimeout(runFinal, 800); });
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

(async () => {
  const saved = LS.get('k', null);
  if (saved && await tryUnlock(saved)) {
    initSky();
    loadMusic(false);
    enterSky(false);
  } else $('#env-screen').style.opacity = '';
})();
})();
